<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>sona.guard - Sign In</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
	{% extends "base.html" %}
	{% block content %}
		<div class="login-container">
		<p id="toast" class="toast toast"></p>
			<div class="login-header">
				<img src="{{ url_for('static', filename='images/sona.guard_assets/sg_logo-full.png') }}" alt="sona.guard logo">
			</div>


			<form id="login-form" class="login-form" autocomplete="off" action="">

				<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

				<div class="form-group">
					<div class="form-input">
						<i class="fas fa-user"></i>
						<input type="text" id="employee-id" autocomplete="off" name="employee-id" placeholder="Employee ID">
					</div>

					<p class="field-error" id="employee-id-error"></p>
				</div>

				<div class="form-group">
					<div class="form-input">
						<i class="fas fa-lock"></i>
						<input type="password" id="password" name="password" placeholder="Password" autocomplete="off">
					</div>

					<p class="field-error" id="password-error"></p>
				</div>

				<div class="form-group">
					<div class="form-input"><button id="login-button" class="btn btn-primary" type="submit"><i class="fas fa-sign-in-alt"></i> Sign In</button></div>
				</div>

				<p class="forgot-password"><i class="fas fa-circle-exclamation"></i> Forgot your password? Please contact your administrator.</p>
			</form>
		</div>

		<footer class="login-footer">
			<img src="{{ url_for('static', filename='images/app_assets/oriah.studios-logo.png') }}" alt="oriah.studios logo">
			<p class="monitor"><i class="fas fa-video"></i> Authorized Personnel Only. All access attempts are monitored and recored</p>
		</footer>

	<script src="{{ url_for('static', filename='js/login.js') }}"></script>
	{% endblock %}
</body>
</html>
